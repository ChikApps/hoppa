<html lang="he" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoppa</title>
<link rel="stylesheet" href="css/hoppa.css">
<script src="js/theme.js"></script>
</head>
<body class="page-popup">
<main class="popup" id="popup">

  <header class="p-head">
    <img class="logo" src="icons/hoppa.svg" alt="" width="26" height="26">
    <h1 class="p-name">Hoppa</h1>
    <button type="button" class="theme-btn" data-theme-toggle aria-pressed="false" aria-label="מצב יום" title="מצב יום">
      <svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle class="core" cx="12" cy="12" r="4.2"/><g class="rays"><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.5 1.5M17.1 17.1l1.5 1.5M5.4 18.6l1.5-1.5M17.1 6.9l1.5-1.5"/></g></svg>
    </button>
    <label class="power" for="power">
      <span class="power-dot" aria-hidden="true"></span>
      <span id="powerLabel">פעיל</span>
      <input type="checkbox" class="sw" role="switch" id="power" checked>
    </label>
  </header>

  <div class="p-site" id="siteRow" hidden>
    <label class="site-label" for="siteOff">כבוי באתר הזה · <bdi class="domain" id="domain"></bdi></label>
    <input type="checkbox" class="sw warn" role="switch" id="siteOff">
  </div>
  <p class="p-banner" id="banner" role="status" hidden></p>

  <div class="p-search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
    <input id="q" type="search" placeholder="חיפוש קיצור או טקסט…" aria-label="חיפוש קיצור או טקסט…" autocomplete="off" spellcheck="false">
  </div>
  <p class="p-help" id="help">לחיצה על שורה מעתיקה את הטקסט</p>

  <div class="p-list" id="list" aria-describedby="help"></div>

  <footer class="p-foot">
    <a class="p-manage" href="options.html" id="manage">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg>
      ניהול קיצורים
    </a>
    <span class="p-keys" aria-hidden="true"><kbd>↑↓</kbd><kbd>Enter</kbd></span>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</main>

<script src="js/popup.js"></script>
</body>
</html>
